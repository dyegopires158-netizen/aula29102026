<!DOCTYPE html>
<!-- Declara que o documento é HTML5 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />                       <!-- aceita acentos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- ajusta no celular -->
  <title>Videogames - Dyego</title>
  <link rel="stylesheet" href="style.css" />     <!-- liga o CSS -->
</head>
<body>
  <main class="container">
    <h1>Videogames do Dyego</h1>
    <p class="subtitulo">Lista de produtos lida de um array JavaScript.</p>

    <!-- Barra de filtros: busca por nome e seleção de categoria -->
    <div class="filtros">
      <div class="campo">
        <label for="busca">Buscar produto</label>
        <input type="text" id="busca" placeholder="Ex.: PlayStation" autocomplete="off" />
      </div>
      <div class="campo">
        <label for="categoria">Categoria</label>
        <!-- As opções são criadas pelo JS a partir do array -->
        <select id="categoria"></select>
      </div>
    </div>

    <!-- Resumo (contador, unidades e valor do estoque) preenchido pelo JS -->
    <p id="resumo" class="resumo" aria-live="polite"></p>

    <!-- A tabela. O <tbody> começa vazio e o JS cria as linhas -->
    <div class="tabela-rolagem">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th class="num">Qtd.</th>
            <th class="num">Preço (R$)</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <!-- ORDEM IMPORTANTE: primeiro os dados, depois a lógica que usa os dados -->
  <script src="dados.js"></script>
  <script src="script.js"></script>
</body>
</html>
